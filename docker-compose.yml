services:
  db:
    image: postgres:16-alpine@sha256:16bc17c64a573ef34162af9298258d1aec548232985b33ed7b1eac33ba35c229
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sfe}
      POSTGRES_USER: ${POSTGRES_USER:-sfe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sfe-local-only}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sfe} -d ${POSTGRES_DB:-sfe}"]
      interval: 3s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-sfe}:${POSTGRES_PASSWORD:-sfe-local-only}@db:5432/${POSTGRES_DB:-sfe}
      SEED_DIR: /seed
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-local-uncommitted}
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 3s
      timeout: 3s
      retries: 20
  frontend:
    build: ./frontend
    ports: ["5173:8080"]
    depends_on:
      backend: {condition: service_healthy}
volumes:
  postgres-data:
