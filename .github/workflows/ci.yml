name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - run: cd backend && uv sync --extra dev
      - run: cd backend && uv run pytest -q
      - run: cd backend && uv run ruff check app tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd frontend && npm ci
      - run: cd frontend && npm test
      - run: cd frontend && npm run build
  fullstack-postgres-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        with: {node-version: "20", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: cd backend && uv sync --extra dev
      - run: cd frontend && npm ci && npx playwright install --with-deps chromium
      - run: GIT_COMMIT_SHA=${GITHUB_SHA} docker compose up -d --build
      - run: make smoke
      - name: PostgreSQL-backed API integration
        run: cd backend && POSTGRES_API_URL=http://127.0.0.1:8000 uv run pytest -q tests/test_postgres_integration.py
      - name: Assert seeded database counts
        run: |
          test "$(docker compose exec -T db psql -U sfe -d sfe -tAc 'select count(*) from projects')" = "1"
          test "$(docker compose exec -T db psql -U sfe -d sfe -tAc 'select count(*) from batches')" = "1"
          test "$(docker compose exec -T db psql -U sfe -d sfe -tAc 'select count(*) from samples')" = "12"
          test "$(docker compose exec -T db psql -U sfe -d sfe -tAc 'select count(*) from measurements')" = "36"
      - run: cd frontend && npm run e2e
      - if: always()
        run: docker compose logs --no-color > docker-compose.log && docker compose down -v
